name: flutter_devkit
description: In-app developer tools for Flutter apps with Dio — a dev panel, an HTTP inspector, and per-route backend scenario switching for QA.
version: 0.3.0
homepage: https://github.com/ahadjonovss/flutter_devkit
repository: https://github.com/ahadjonovss/flutter_devkit
issue_tracker: https://github.com/ahadjonovss/flutter_devkit/issues
topics:
  - devtools
  - debugging
  - dio
  - http
  - qa

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
